name: Reboot source-tree cleanup

on:
  push:
    branches:
      - reboot/studio-v1
    paths:
      - src/**
      - .github/workflows/source-hygiene-cleanup.yml
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - .github/workflows/source-hygiene-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-hygiene-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-and-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'reboot/studio-v1'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout reboot branch
        uses: actions/checkout@v4
        with:
          ref: reboot/studio-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Show source root before cleanup
        run: find src -mindepth 1 -maxdepth 1 -printf '%f\n' | sort

      - name: Remove unreachable E60 source residue
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for entry in src/*; do
            name="$(basename "$entry")"
            case "$name" in
              App.tsx|main.tsx|vite-env.d.ts|app|core|features|graph|mission|styles)
                ;;
              *)
                echo "Removing legacy source entry: $entry"
                rm -rf -- "$entry"
                ;;
            esac
          done

      - name: Assert exact reboot source root
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-src-root.txt <<'EOF'
          App.tsx
          app
          core
          features
          graph
          main.tsx
          mission
          styles
          vite-env.d.ts
          EOF
          find src -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > /tmp/actual-src-root.txt
          diff -u /tmp/expected-src-root.txt /tmp/actual-src-root.txt

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: Studio logic tests
        run: npm run test:logic

      - name: Frontend production build after cleanup
        run: npm run build

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust locked check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Tauri production-path debug build after cleanup
        run: npm run tauri -- build --debug --no-bundle

      - name: Verify diff hygiene
        run: git diff --check

      - name: Show cleanup summary
        run: git status --short && git diff --stat

      - name: Remove one-shot workflow
        run: rm .github/workflows/source-hygiene-cleanup.yml

      - name: Commit validated source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/source-hygiene-cleanup.yml
          git commit -m "cleanup: remove unreachable E60 source residue"
          git push origin HEAD:reboot/studio-v1
