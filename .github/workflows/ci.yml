name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: Studio logic tests
        run: npm run test:logic

      - name: TypeScript and Vite build
        run: npm run build

  rust:
    name: Rust tests, check and Tauri build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Tauri production-path debug build
        run: npm run tauri -- build --debug --no-bundle

  core-contract:
    name: Pinned Core acceptance matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Checkout OrbitFabric Core integration baseline
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: 47d37ec2c50eae40e13303eea900eb119bd2e0dd
          path: orbitfabric-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Core
        run: python -m pip install -e ./orbitfabric-core

      - name: Export Studio-required surfaces for acceptance missions
        run: |
          set -euo pipefail

          for mission in \
            demo-3u \
            finch-inspired-minislice \
            oresat-inspired-minislice \
            spacelab-inspired-communications-minislice
          do
            out="/tmp/${mission}"
            mkdir -p "$out"

            orbitfabric export mission-snapshot "orbitfabric-core/examples/${mission}/mission" \
              --json "$out/mission_snapshot.json"
            orbitfabric export entity-index "orbitfabric-core/examples/${mission}/mission" \
              --json "$out/entity_index.json"
            orbitfabric export relationship-manifest "orbitfabric-core/examples/${mission}/mission" \
              --json "$out/relationship_manifest.json"
            orbitfabric lint "orbitfabric-core/examples/${mission}/mission" \
              --json "$out/lint_report.json"
          done

      - name: Assert Studio integration and mission-diversity contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          missions = [
              'demo-3u',
              'finch-inspired-minislice',
              'oresat-inspired-minislice',
              'spacelab-inspired-communications-minislice',
          ]

          loaded = {}
          for mission in missions:
              root = Path('/tmp') / mission
              snapshot = json.loads((root / 'mission_snapshot.json').read_text())
              entities = json.loads((root / 'entity_index.json').read_text())
              relationships = json.loads((root / 'relationship_manifest.json').read_text())
              lint = json.loads((root / 'lint_report.json').read_text())

              assert snapshot['kind'] == 'orbitfabric.mission_snapshot'
              assert snapshot['snapshot_version'] == '0.1-candidate'
              assert snapshot['result'] == 'loaded'
              assert snapshot['model'] is not None

              assert entities['kind'] == 'orbitfabric.entity_index'
              assert entities['index_version'] == '0.1'

              assert relationships['kind'] == 'orbitfabric.relationship_manifest'
              assert relationships['manifest_version'] == '0.1-candidate'

              assert lint['tool'] == 'orbitfabric-lint'
              assert lint['mission'] == snapshot['mission']['id']
              assert entities['mission']['id'] == snapshot['mission']['id']
              assert relationships['mission']['id'] == snapshot['mission']['id']

              loaded[mission] = (snapshot, entities, relationships)

          demo_relationships = loaded['demo-3u'][2]
          required_fdir = {
              'fault_observes_telemetry',
              'fault_recovery_targets_mode',
              'fault_recovery_dispatches_command',
              'autonomous_action_triggered_by_fault',
              'autonomous_action_uses_command_source',
              'recovery_intent_targets_mode',
              'recovery_intent_includes_command',
          }
          emitted = set(demo_relationships['counts']['relationship_types'])
          assert required_fdir <= emitted

          finch_entities = loaded['finch-inspired-minislice'][1]['entities']
          duplicated_id = [
              entity for entity in finch_entities
              if entity['id'] == 'hyperspectral_payload'
          ]
          assert len(duplicated_id) >= 2
          assert len({entity['domain'] for entity in duplicated_id}) >= 2

          spacelab_snapshot = loaded['spacelab-inspired-communications-minislice'][0]
          assert spacelab_snapshot['model']['payloads'] == []
          PY

      - name: Set up Node for Context Map Core regression
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked Studio dependencies
        run: npm ci

      - name: Exhaustive Context Map regression against pinned Core fixtures
        env:
          ORBITFABRIC_STUDIO_CORE_SURFACES: /tmp
        run: npm run test:logic

  adapter-lifecycle-contract:
    name: Pinned Core v1.3.0 Adapter Lifecycle acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Checkout OrbitFabric Core v1.3.0 release commit
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: a25917e81c90396df2b189834e83cf852fa4da5f
          path: orbitfabric-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Core v1.3.0
        run: python -m pip install -e ./orbitfabric-core

      - name: Create Core-owned lifecycle fixture state
        env:
          ORBITFABRIC_STATE_DIR: /tmp/orbitfabric-lifecycle/state
        run: |
          set -euo pipefail
          root=/tmp/orbitfabric-lifecycle
          mkdir -p "$root/instance" "$ORBITFABRIC_STATE_DIR"
          cp orbitfabric-core/conformance/fixtures/integration-v1/valid/manifest-zero-input.json \
            "$root/instance/integration_package.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from orbitfabric.adapter_manager.inventory import InstalledAdapterInventory
          from orbitfabric.adapter_manager.models import AdapterSourceCoordinate, InstalledAdapterRecord

          root = Path('/tmp/orbitfabric-lifecycle')
          state_root = Path(os.environ['ORBITFABRIC_STATE_DIR'])
          instance_root = root / 'instance'
          manifest_path = instance_root / 'integration_package.json'
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()

          source = {
              'authority': 'test.local',
              'publisher': 'fixture',
              'name': 'studio-lifecycle',
          }
          descriptor = {
              'kind': 'orbitfabric.adapter_release',
              'descriptor_version': '0.1-candidate',
              'source_coordinate': source,
              'release_version': '1.0.0',
              'source_provenance': {'commit': 'studio-lifecycle-fixture'},
              'artifacts': [
                  {
                      'id': 'fixture-wheel',
                      'artifact_type': 'python-wheel',
                      'filename': 'fixture.whl',
                      'sha256': '2' * 64,
                      'size': 0,
                      'selectors': {},
                  }
              ],
              'integration_package': {'sha256': manifest_sha},
          }
          descriptor_path = instance_root / 'release_descriptor.json'
          descriptor_path.write_text(json.dumps(descriptor, indent=2) + '\n', encoding='utf-8')
          descriptor_sha = hashlib.sha256(descriptor_path.read_bytes()).hexdigest()

          endpoint = instance_root / 'adapter-endpoint'
          endpoint.write_text('#!/bin/sh\nexit 0\n', encoding='utf-8')
          endpoint.chmod(0o755)

          record = InstalledAdapterRecord(
              instance_id='studio-lifecycle-fixture',
              source_coordinate=AdapterSourceCoordinate(**source),
              release_version='1.0.0',
              release_descriptor_path=descriptor_path,
              release_descriptor_sha256=descriptor_sha,
              artifact_id='fixture-wheel',
              artifact_sha256='2' * 64,
              backend_id='python-wheel-managed-env',
              install_root=instance_root,
              manifest_path=manifest_path,
              manifest_sha256=manifest_sha,
              execution_argv_prefix=[str(endpoint.resolve())],
              acceptance_policy='development-explicit-source',
              acceptance_warnings=[],
          )
          InstalledAdapterInventory(state_root).add(record)

          lock = {
              'kind': 'orbitfabric.adapter_project_lock',
              'lock_version': '0.1-candidate',
              'adapters': [
                  {
                      'source_coordinate': source,
                      'release_version': '1.0.0',
                      'release_descriptor': {'sha256': descriptor_sha},
                      'artifact': {'id': 'fixture-wheel', 'sha256': '0' * 64},
                      'installation_backend': {'id': 'python-wheel-managed-env'},
                  }
              ],
          }
          (root / 'adapter-project-lock.json').write_text(
              json.dumps(lock, indent=2) + '\n', encoding='utf-8'
          )

          catalog = {
              'kind': 'orbitfabric.adapter_catalog',
              'catalog_version': '0.1-candidate',
              'adapters': [
                  {
                      'source_coordinate': source,
                      'releases': [
                          {
                              'version': '1.0.0',
                              'release_descriptor_digest': {
                                  'algorithm': 'sha256',
                                  'value': descriptor_sha,
                              },
                              'sources': [
                                  {'binding': 'fixture-source', 'release_ref': 'v1.0.0'}
                              ],
                          }
                      ],
                  }
              ],
              'source_bindings': [
                  {'id': 'fixture-source', 'provider': 'fixture', 'config': {}}
              ],
          }
          (root / 'adapter-catalog.json').write_text(
              json.dumps(catalog, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Export real Core Adapter Lifecycle surfaces
        env:
          ORBITFABRIC_STATE_DIR: /tmp/orbitfabric-lifecycle/state
        run: |
          set -euo pipefail
          root=/tmp/orbitfabric-lifecycle

          orbitfabric adapter list --json > "$root/installed.json"

          set +e
          orbitfabric adapter verify studio-lifecycle-fixture --json > "$root/verify.json"
          verify_rc=$?
          orbitfabric adapter lock check "$root/adapter-project-lock.json" --json > "$root/lock.json"
          lock_rc=$?
          set -e

          test "$verify_rc" -eq 1
          test "$lock_rc" -eq 1

          orbitfabric adapter catalog select \
            "$root/adapter-catalog.json" \
            test.local:fixture/studio-lifecycle \
            --version 1.0.0 \
            --json > "$root/catalog.json"

      - name: Assert Core lifecycle producer facts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/orbitfabric-lifecycle')
          installed = json.loads((root / 'installed.json').read_text())
          verify = json.loads((root / 'verify.json').read_text())
          lock = json.loads((root / 'lock.json').read_text())
          catalog = json.loads((root / 'catalog.json').read_text())

          assert len(installed) == 1
          assert installed[0]['instance_id'] == 'studio-lifecycle-fixture'
          assert verify['release_descriptor_integrity']['status'] == 'PASS'
          assert verify['manifest_integrity']['status'] == 'PASS'
          assert verify['manifest_conformance']['status'] == 'PASS'
          assert verify['execution_binding']['status'] == 'PASS'
          assert verify['backend_materialization']['status'] == 'FAIL'
          assert lock['status'] == 'NOT_SATISFIED'
          assert lock['adapters'][0]['status'] == 'MISMATCH'
          assert lock['adapters'][0]['candidate_mismatches'][0]['dimensions'] == ['artifact_sha256']
          assert catalog['release_version'] == '1.0.0'
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked Studio dependencies
        run: npm ci

      - name: Consume Core v1.3.0 lifecycle surfaces through Studio contracts
        env:
          ORBITFABRIC_STUDIO_LIFECYCLE_SURFACES: /tmp/orbitfabric-lifecycle
        run: npm run test:logic

  reference-integration:
    name: Real reference Integration Package acceptance
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Checkout pinned reference Integration Package
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/OrbitFabric-OpenOBSW-PoC
          ref: 80034335d7dfca3a715de217d981983616944cc0
          path: reference-poc

      - name: Checkout pinned Core producer
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: 82c103a6dec32eeadc5acfcb01d1a9c641a54a42
          path: reference-core

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Core and reference adapter
        run: |
          python -m pip install -e ./reference-core
          python -m pip install -e ./reference-poc/reference_adapter

      - name: Export real coherent Core Integration Input Set
        run: |
          mkdir -p /tmp/orbitfabric-reference/input
          orbitfabric export integration-input-set \
            reference-poc/orbitfabric_models/mission \
            --output-dir /tmp/orbitfabric-reference/input

      - name: Execute real adapter through Studio Rust runner
        env:
          ORBITFABRIC_STUDIO_ADAPTER_ACCEPTANCE_EXECUTABLE: orbitfabric-openobsw-opensvf
          ORBITFABRIC_STUDIO_ADAPTER_ACCEPTANCE_INPUT_MANIFEST: /tmp/orbitfabric-reference/input/integration_input_manifest.json
          ORBITFABRIC_STUDIO_ADAPTER_ACCEPTANCE_PROFILE: ${{ github.workspace }}/reference-poc/orbitfabric_models/profiles/openobsw_opensvf_poc_v0.yaml
          ORBITFABRIC_STUDIO_ADAPTER_ACCEPTANCE_OUTPUT_DIR: /tmp/orbitfabric-reference/result
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml \
            external_adapter_acceptance_executes_through_studio_runner \
            -- --nocapture

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked Studio dependencies
        run: npm ci

      - name: Consume real package and Result through Studio contracts
        env:
          ORBITFABRIC_STUDIO_REFERENCE_POC: ${{ github.workspace }}/reference-poc
          ORBITFABRIC_STUDIO_REFERENCE_INPUT_MANIFEST: /tmp/orbitfabric-reference/input/integration_input_manifest.json
          ORBITFABRIC_STUDIO_REFERENCE_RESULT: /tmp/orbitfabric-reference/result/integration_result.json
        run: npm run test:logic
