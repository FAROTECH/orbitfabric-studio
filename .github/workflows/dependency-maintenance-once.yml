name: One-shot dependency maintenance

on:
  push:
    paths:
      - .github/workflows/dependency-maintenance-once.yml

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reboot branch
        uses: actions/checkout@v4
        with:
          ref: reboot/studio-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove unused reboot dependencies
        run: npm uninstall @monaco-editor/react html-to-image

      - name: Upgrade Vite to the audited 6.x fix
        run: npm install --save-dev --save-exact vite@6.4.3

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix

      - name: Require a clean npm audit
        run: npm audit --audit-level=low

      - name: Remove this one-shot workflow
        run: rm .github/workflows/dependency-maintenance-once.yml

      - name: Commit audited dependency set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-maintenance-once.yml
          git commit -m "chore(deps): clean public preview dependency set"
          git push origin HEAD:reboot/studio-v1
