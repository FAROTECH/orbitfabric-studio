name: Update graph dependencies

on:
  push:
    branches:
      - reboot/studio-v1
    paths:
      - .github/workflows/update-graph-deps.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reboot/studio-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned graph dependencies
        run: npm install --save-exact @xyflow/react@12.11.2 elkjs@0.11.1

      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "build: add React Flow and ELK graph dependencies"
          git push origin HEAD:reboot/studio-v1
