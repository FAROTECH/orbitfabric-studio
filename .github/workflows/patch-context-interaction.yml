name: Patch Context Map interaction

on:
  push:
    branches:
      - reboot/studio-v1
    paths:
      - .github/workflows/patch-context-interaction.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reboot/studio-v1

      - name: Apply interaction fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          context = Path('src/graph/ContextMap.tsx')
          text = context.read_text()
          text = text.replace(
              '        selectable: false,\n        focusable: false,',
              '        selectable: true,\n        focusable: true,',
          )
          text = text.replace(
              '      elementsSelectable={false}\n      nodesFocusable={false}',
              '      elementsSelectable={true}\n      nodesFocusable={true}',
          )
          context.write_text(text)

          css = Path('src/styles/relations.css')
          text = css.read_text()
          text = text.replace(
              '.context-flow .react-flow__pane,\n.context-flow .react-flow__viewport {\n  cursor: grab;\n}',
              '.context-flow .react-flow__pane {\n  cursor: grab;\n}',
          )
          text = text.replace(
              '.context-flow .react-flow__node {\n  border: 0;',
              '.context-flow .react-flow__node {\n  pointer-events: auto;\n  cursor: default;\n  border: 0;',
          )
          css.write_text(text)

          main = Path('src/main.tsx')
          text = main.read_text()
          marker = 'import "./styles/responsive.css";\n\n'
          addition = '''import "./styles/responsive.css";\n\n// Studio owns contextual actions. Never expose the browser/WebView menu.\ndocument.addEventListener("contextmenu", (event) => {\n  event.preventDefault();\n});\n\n'''
          if 'document.addEventListener("contextmenu"' not in text:
              text = text.replace(marker, addition)
          main.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -n 'selectable:' src/graph/ContextMap.tsx
          grep -n 'elementsSelectable' src/graph/ContextMap.tsx
          grep -n 'nodesFocusable' src/graph/ContextMap.tsx
          grep -n 'contextmenu' src/main.tsx

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/graph/ContextMap.tsx src/styles/relations.css src/main.tsx
          git commit -m "fix(relations): restore node interaction and suppress WebView menu"
          git push origin HEAD:reboot/studio-v1
